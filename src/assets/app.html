<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper" data-hljs="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Viewer</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="hljs-scoped.css">
<script>
/* 首帧主题（specs/01 R-01-07）：Python 经 URL hash 注入 css_vars() 结果，
 * 在首次绘制前套用，避免深色主题「先亮后暗」闪一下。
 * hash 格式：#pre=<encodeURIComponent(JSON)>；无注入时退回 app.css 的 paper 兜底。 */
(function () {
  var raw = location.hash.replace(/^#pre=/, "");
  if (raw === location.hash) return;      // 没有 pre=
  var vars;
  try { vars = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
  if (!vars || typeof vars !== "object") return;
  var root = document.documentElement;
  for (var k in vars) {
    if (k === "__hljs") root.setAttribute("data-hljs", vars[k]);
    else root.style.setProperty(k, vars[k]);
  }
})();
</script>
</head>
<body>
<div id="appbar">
  <div id="win-title" data-drag="1">MD Viewer</div>
  <div id="menubar"></div>
  <div id="win-dragspace" data-drag="1"></div>
  <div id="win-controls">
    <button id="win-min" class="win-btn" title="最小化">&#8211;</button>
    <button id="win-max" class="win-btn" title="最大化">&#9633;</button>
    <button id="win-close" class="win-btn win-close" title="关闭">&#10005;</button>
  </div>
</div>
<div id="tabbar" hidden></div>
<div id="stack">
  <aside id="toc" hidden>
    <div id="toc-list"></div>
    <div id="toc-empty" hidden>无目录</div>
  </aside>
  <div id="editor-host"></div>
  <div id="reader" class="md-body" hidden></div>
</div>
<div id="statusbar"><span id="status-left"></span><span id="status-right"></span></div>
<div id="palette" hidden>
  <div id="palette-box">
    <input id="palette-input" placeholder="输入命令…（Ctrl+K）" autocomplete="off">
    <div id="palette-list"></div>
  </div>
</div>
<div id="resize-edges">
  <div class="rz rz-n" data-rz="n"></div>
  <div class="rz rz-s" data-rz="s"></div>
  <div class="rz rz-w" data-rz="w"></div>
  <div class="rz rz-e" data-rz="e"></div>
  <div class="rz rz-nw" data-rz="nw"></div>
  <div class="rz rz-ne" data-rz="ne"></div>
  <div class="rz rz-sw" data-rz="sw"></div>
  <div class="rz rz-se" data-rz="se"></div>
</div>
<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<script src="cm6.bundle.js"></script>
<script src="editor.js"></script>
<script src="reader.js"></script>
<script src="toc.js"></script>
<script src="app.js"></script>
</body>
</html>
